[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safe"
version = "0.1.0"
description = "Keep real credentials and Git history away from AI coding agents: scan, sanitize, verify, review and integrate."
readme = "README.md"
license = "MIT"
# The specification targets Python 3.12+. The code is 3.12-compatible and is
# tested on 3.11 because that was the newest interpreter available at build time.
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "PyYAML>=6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# PHP function/method parameter tracing (scanner.php_dataflow); optional.
php = ["tree-sitter>=0.23", "tree-sitter-php>=0.23"]

[project.scripts]
ai-safe = "ai_safe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_safe = ["skill_templates/*/SKILL.md", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gitleaks: requires the gitleaks binary"]
addopts = "-ra"
